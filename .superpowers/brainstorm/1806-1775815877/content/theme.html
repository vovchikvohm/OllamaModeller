<h2>Цветовая тема</h2>
<p class="subtitle">Какой стиль интерфейса предпочитаете?</p>

<div class="options">
  <div class="option" data-choice="system" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Системная</h3>
      <p>Следует настройкам Windows (светлая/тёмная)</p>
    </div>
  </div>
  <div class="option" data-choice="dark" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>Тёмная</h3>
      <p>Тёмный интерфейс, удобный для developer tools</p>
    </div>
  </div>
  <div class="option" data-choice="light" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>Светлая</h3>
      <p>Классический светлый интерфейс</p>
    </div>
  </div>
</div>
